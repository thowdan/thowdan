name: Update Profile Cards

# Generates the stats / languages / activity / trophy images inside this repo,
# so the README no longer depends on public Vercel instances that get paused.

on:
  schedule:
    - cron: "30 0 * * *" # daily at 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional: add a repo secret STATS_TOKEN (classic PAT with repo + read:user)
      # to include private-repo stats. Falls back to the built-in token.
      CARD_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Activity graph
        env:
          GITHUB_TOKEN: ${{ env.CARD_TOKEN }}
        run: node .github/scripts/activity-graph.mjs "${{ github.repository_owner }}" profile/activity-graph.svg

      - name: Trophies (keeps the last good copy if the mirror is down)
        continue-on-error: true
        run: |
          url="https://github-trophy-jagratadeb.vercel.app/?username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&no-bg=true&row=1&column=7&margin-w=8&margin-h=8"
          if curl -fsSL --max-time 60 "$url" -o /tmp/trophy.svg && grep -q "<svg" /tmp/trophy.svg; then
            mv /tmp/trophy.svg profile/trophy.svg
          else
            echo "Trophy mirror unavailable; keeping existing profile/trophy.svg"
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile cards"
          git pull --rebase
          git push
